# Companies whose career pages are read via their ATS's public job-board feed.
#
# Add a company from its careers URL without guessing the ATS:
#   job-radar companies add "https://jobs.ashbyhq.com/<board>" --name "Company"
# (this only parses the URL; it makes no request).
#
# Fields: name, ats (greenhouse|lever|recruitee|smartrecruiters|ashby|personio),
#         slug (board token / site / company id), eu (lever only), enabled.
#
# Verified on 2026-11-16: each feed answered 200 with at least one job.
# `params` are extra query parameters for the list call (SmartRecruiters: country filter).

