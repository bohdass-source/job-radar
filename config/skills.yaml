# Canonical skill -> category + synonyms (case-insensitive; matched on word
# boundaries). Extraction output is mapped onto these names so that
# "PyTorch", "pytorch" and "Torch" all count as one skill in statistics and matching.
# Add a skill here once and every component (rules extractor, LLM output
# normalisation, matching, report) picks it up.

skills:
