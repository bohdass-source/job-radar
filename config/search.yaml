# "Restrictions" filter: employment agencies / temporary staffing. Matched in the
# company name, or these phrases in the ad text.
agency_company_markers: [brunel, hays, randstad, adecco, manpower, gulp, computer futures, etengo, solcom, amadeus fire,
                         orizon, akkodis, ferchau, yacht, persona service, piening, dis ag, tempton, timepartner,
                         experis, robert half, michael page, page personnel, personal, zeitarbeit, personaldienst,
                         recruitment, recruiting, staffing, headhunt]
agency_text_markers: [arbeitnehmerüberlassung, im kundeneinsatz, für unseren kunden, for our client, zeitarbeit,
                      personaldienstleister, personalvermittlung]
