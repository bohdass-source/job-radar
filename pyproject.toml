[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "job-radar"
version = "0.1.0"
description = "AI/ML job market radar for Germany: multi-source collection, cross-source dedup, freshness checks, LLM extraction, semantic search and profile matching."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pymongo>=4.7",
  "numpy>=1.26",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0"]
cv = ["pypdf>=4.0", "python-docx>=1.1"]
dev = ["pytest>=8.0", "mongomock>=4.1"]

[project.scripts]
job-radar = "job_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
