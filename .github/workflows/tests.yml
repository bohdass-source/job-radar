name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # sentence-transformers is not needed: tests use a hashing embedder,
      # mongomock instead of MongoDB and httpx.MockTransport instead of the network.
      - run: pip install -e ".[dev,cv]"
      - run: python -m pytest -q
